<!DOCTYPE html>
<html>
<link rel="stylesheet" href="bf.css">
<link rel="icon" href="pngs/icons/icon.ico">

<head>
    <meta charset="UTF-8">
    <title> Home page</title>
    <meta name=" description " content=" this is sports website">
</head>

<body>
    <div class="s">
        <p class="s">
            <H1> <b>Sign in</b></H1>
        </p>
    </div>
    <hr>

    <div class="form" style="padding-bottom: 10px;padding-top:10px">
        <form method="POST" action="" id="signInForm" onsubmit="return validateAndSubmit(event)" style="padding-bottom: 10px;padding-top:10px">
            <h3>
                <div>
                    <label> Username</label>

                    <input type="text" name="usr" id="usr" required placeholder="Enter your Username" autofocus>
                </div>

                <br>

                <div>
                    <label> password</label>
                    <input type="password" required placeholder=" Enter your Password" name="pass" id="pass" minlength="8"
                        maxlength="12">
                </div>
                <br>


                <div>
                    <label> E-mail</label>
                    <input type="email" required placeholder="Enter your E-mail" name="mail" id="mail">


                </div>
                <br>
                <div>

                    <label for="select"> Country</label>

                    <select name="country" id="country" required>
                        <option value="مصر"> مصر</option>
                        <option value=" ليبيا">ليبيا </option>
                        </select>
                    <br>
                    <br>
                </div>

                <input type="submit" style="font-size: medium; margin-right: 20px;">
                <input type="reset" style="font-size: medium;">

            </form>
            </h3>
    </div>
    <hr>

    <div class="quistion">
        <p>
            <figcaption> <b>
                <h1> ! شارك معنا برأيك لنعرف ما هو اقوي دوري علي الكوكب </h1>
                </b>
            </figcaption>
        </p>

        </figcaption>
        <h2>
            <b>

                <div class="choice">
                    <input type="radio" name="strongest" value="premier_league" id="1">
                    <label for="1"> <img src="pngs/icons/premier.ico" alt="" width="70" height="60"> Premier League</label><br>
                    <input type="radio" name="strongest" value="laliga" id="2">
                    <label for="2"> <img src="pngs/icons/laliga.ico" alt="" width="70" height="60"> LaLiga</label>

                    <br>
                    <input type="radio" name="strongest" value="Bundesliga" id="3">
                    <label for="3"> <img src="pngs/icons/bundesliga.ico" alt="" width="70" height="60"> Bundesliga</label>
                    <br>

                    <input type="radio" name="strongest" value="seria_a" id="4">
                    <label for="4"> <img src="pngs/icons/seria_a.ico" alt="" width="70" height="60"> Serie A</label>
                    <br>
                    <input type="radio" name="strongest" value="Ligue_1" id="5">
                    <label for="5"> <img src="pngs/icons/Ligue_1.ico" alt="" width="70" height="60"> Ligue 1</label>
                </div>
            </b>
        </div>


    <br>
    <br>
    <br>

    <footer>
        <p>&copy; 2023 YASSA KAMILLE. All rights reserved.</p>
    </footer>

    <script>
        function validateAndSubmit(event) {
           
            const form = document.getElementById('signInForm');
            if (!form.checkValidity()) {
              
                return true; 
            }

        
            const radios = document.getElementsByName('strongest');
            let isVoted = false;

            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    isVoted = true;
                    break;
                }
            }

            if (!isVoted) {
                event.preventDefault();
                alert("Please select your vote for the strongest league!");
                return false;
            }

                  event.preventDefault();

        
            alert("Your vote has been submitted");

            return false; 
        }
    </script>
</body>
</html>
