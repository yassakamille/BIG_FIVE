    <div class="s">
        <h1><b>Sign up</b></h1>

    <hr>

    <div class="form" style="padding:10px 0;">
        <form id="mainForm" method="POST" action="" style="padding:10px 0;">
            <h3>

                <div>
                    <label>Username</label>
                    <input type="text" name="usr" required placeholder="Enter your Username" autofocus>
                </div>

                <br>

                <div>
                    <label>Password</label>
                    <input type="password" name="pass" required minlength="8" maxlength="12" placeholder="Enter your Password">
                </div>

                <br>

                <div>
                    <label>E-mail</label>
                    <input type="email" name="mail" required placeholder="Enter your E-mail">
                </div>

                <br>

                <div>
                    <label for="select">Country</label>
                    <select name="country" id="select" required>
                        <option value="">اختر دولتك</option>
                        <option value="مصر">مصر</option>
                        <option value="ليبيا">ليبيا</option>
                        <option value="الجزائر">الجزائر</option>
                        <option value="تونس">تونس</option>
                        <option value="المغرب">المغرب</option>
                        <option value="موريتانيا">موريتانيا</option>
                        <option value="السودان">السودان</option>
                        <option value="الصومال">الصومال</option>
                        <option value="جيبوتي">جيبوتي</option>
                        <option value="فلسطين">فلسطين</option>
                        <option value="الأردن">الأردن</option>
                        <option value="سوريا">سوريا</option>
                        <option value="العراق">العراق</option>
                        <option value="لبنان">لبنان</option>
                        <option value="السعودية">السعودية</option>
                        <option value="الكويت">الكويت</option>
                        <option value="الأمارات">الأمارات</option>
                        <option value="اليمن">اليمن</option>
                        <option value="البحرين">البحرين</option>
                        <option value="قطر">قطر</option>
                        <option value="جزر القمر">جزر القمر</option>
                        <option value="عمان">عمان</option>
                    </select>
                </div>

                <br><br>

                <input type="submit" style="font-size:medium; margin-right:20px;">
                <input type="reset" style="font-size:medium;">

            </h3>
        </form>

    <!-- POPUP MESSAGE SCRIPT -->
    <script>
        document.getElementById("mainForm").addEventListener("submit", function (e) {
            const usr = document.querySelector('input[name="usr"]').value.trim();
            const pass = document.querySelector('input[name="pass"]').value.trim();
            const mail = document.querySelector('input[name="mail"]').value.trim();
            const country = document.querySelector('select[name="country"]').value;
            const vote = document.querySelector('input[name="strongest"]:checked');

            if (!usr || !pass || !mail || !country || !vote) {
                e.preventDefault();
                alert("Please fill all fields and choose your vote");
                return;
            }

            alert("Your vote has been submitted");
        });
    </script>
